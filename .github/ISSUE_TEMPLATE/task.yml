name: Task
description: 执行仓库内 ECC 任务
title: "[ECC-NNN] "
labels: ["type:task", "status:ready"]
body:
  - type: input
    id: task
    attributes:
      label: 任务文件
      placeholder: docs/tasks/backlog/ECC-NNN.md
