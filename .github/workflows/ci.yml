name: CI
on:
  push: {branches: [main]}
  merge_group:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_DB: ecc_test, POSTGRES_USER: ecc, POSTGRES_PASSWORD: test-only}
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U ecc -d ecc_test" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      ECC_DATABASE_URL: postgresql://ecc:test-only@localhost:5432/ecc_test
      POSTGRES_PASSWORD: test-only
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: '3.12', cache: pip}
      - uses: actions/setup-node@v7
        with: {node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - run: pip install -e '.[dev]'
      - run: npm ci --prefix apps/web
      - run: ./scripts/verify.sh
  images:
    runs-on: ubuntu-latest
    strategy: {matrix: {target: [api, worker, web]}}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.target }}/Dockerfile
          push: false
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
