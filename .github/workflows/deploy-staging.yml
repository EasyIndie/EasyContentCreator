name: Deploy Staging
on:
  workflow_run: {workflows: [CI], types: [completed], branches: [main]}
concurrency: {group: deploy-staging, cancel-in-progress: false}
permissions: {contents: read, packages: write, id-token: write}
jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v7
        with: {ref: '${{ github.event.workflow_run.head_sha }}'}
      - name: Normalize container registry path
        id: registry
        run: 'echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"'
      - uses: docker/login-action@v4
        with: {registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}'}
      - uses: docker/build-push-action@v7
        id: api
        with: {context: ., file: apps/api/Dockerfile, push: true, tags: '${{ steps.registry.outputs.prefix }}/app:${{ github.event.workflow_run.head_sha }}'}
      - uses: docker/build-push-action@v7
        id: web
        with: {context: ., file: apps/web/Dockerfile, push: true, tags: '${{ steps.registry.outputs.prefix }}/web:${{ github.event.workflow_run.head_sha }}'}
      - name: Deploy immutable image over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_REF: ${{ steps.registry.outputs.prefix }}/app@${{ steps.api.outputs.digest }}
          WEB_IMAGE_REF: ${{ steps.registry.outputs.prefix }}/web@${{ steps.web.outputs.digest }}
          BACKUP_DIR: '${{ secrets.BACKUP_DIR }}'
        with:
          host: '${{ secrets.SSH_HOST }}'
          username: '${{ secrets.SSH_USER }}'
          key: '${{ secrets.SSH_PRIVATE_KEY }}'
          envs: IMAGE_REF,WEB_IMAGE_REF,BACKUP_DIR
          script: cd "${{ secrets.DEPLOY_PATH }}" && IMAGE_REF="$IMAGE_REF" WEB_IMAGE_REF="$WEB_IMAGE_REF" BACKUP_DIR="$BACKUP_DIR" ./deploy/deploy.sh
