name: Nightly
on:
  schedule: [{cron: '43 18 * * *'}]
  workflow_dispatch:
concurrency: {group: nightly, cancel-in-progress: true}
permissions: {contents: read}
jobs:
  slow-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install -e '.[dev]'
      - run: pytest -m 'integration or media' --junitxml=nightly.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: nightly-results, path: nightly.xml, if-no-files-found: ignore}
      - name: Optional provider sandbox checks
        if: vars.PROVIDER_SANDBOX_ENABLED == 'true'
        env:
          PROVIDER_SANDBOX_ENABLED: '${{ vars.PROVIDER_SANDBOX_ENABLED }}'
          PROVIDER_API_KEY: '${{ secrets.PROVIDER_API_KEY }}'
        run: pytest -m provider_sandbox
