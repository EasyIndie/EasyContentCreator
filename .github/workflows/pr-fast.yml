name: PR Fast
on:
  pull_request:
concurrency:
  group: pr-fast-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions: {contents: read}
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install -e '.[dev]'
      - run: ruff format --check . && ruff check . && mypy apps packages && pytest -q
  web:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: apps/web}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - run: npm ci
      - run: npm run lint --if-present && npm run typecheck --if-present && npm test --if-present -- --run && npm run build
  docs-and-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check-docs.sh
      - env: {POSTGRES_PASSWORD: validation-only}
        run: docker compose config --quiet
      - run: git diff --check
