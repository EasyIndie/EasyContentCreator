name: Release
on:
  push:
    tags:
      - 'v*.*.*'
concurrency: {group: 'release-${{ github.ref }}', cancel-in-progress: false}
permissions: {contents: write, packages: write, id-token: write}
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Normalize container registry path
        id: registry
        run: 'echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"'
      - uses: docker/login-action@v4
        with: {registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}'}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        id: app
        with: {context: ., file: apps/api/Dockerfile, platforms: 'linux/amd64,linux/arm64', push: true, tags: '${{ steps.registry.outputs.prefix }}/app:${{ github.ref_name }}'}
      - uses: docker/build-push-action@v7
        id: web
        with: {context: ., file: apps/web/Dockerfile, platforms: 'linux/amd64,linux/arm64', push: true, tags: '${{ steps.registry.outputs.prefix }}/web:${{ github.ref_name }}'}
      - uses: anchore/sbom-action@v0
        with: {image: '${{ steps.registry.outputs.prefix }}/app@${{ steps.app.outputs.digest }}', artifact-name: sbom-app.spdx.json, output-file: sbom-app.spdx.json}
      - uses: anchore/sbom-action@v0
        with: {image: '${{ steps.registry.outputs.prefix }}/web@${{ steps.web.outputs.digest }}', artifact-name: sbom-web.spdx.json, output-file: sbom-web.spdx.json}
      - run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag sbom-app.spdx.json sbom-web.spdx.json
        env: {GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'}
