name: Release
on:
  push:
    tags:
      - 'v*.*.*'
concurrency: {group: 'release-${{ github.ref }}', cancel-in-progress: false}
permissions: {contents: write, packages: write, id-token: write}
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}'}
      - uses: docker/build-push-action@v6
        id: build
        with: {context: ., file: apps/api/Dockerfile, push: true, tags: 'ghcr.io/${{ github.repository }}/app:${{ github.ref_name }}'}
      - uses: anchore/sbom-action@v0
        with: {image: 'ghcr.io/${{ github.repository }}/app@${{ steps.build.outputs.digest }}', artifact-name: sbom.spdx.json, output-file: sbom.spdx.json}
      - run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag sbom.spdx.json
        env: {GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'}
