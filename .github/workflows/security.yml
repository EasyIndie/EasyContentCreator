name: Security
on:
  pull_request:
  push: {branches: [main]}
  schedule: [{cron: '17 2 * * 1'}]
concurrency: {group: 'security-${{ github.ref }}', cancel-in-progress: true}
permissions: {contents: read, security-events: write}
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - name: Scan repository history with Gitleaks
        uses: docker://ghcr.io/gitleaks/gitleaks:v8.28.0
        with:
          args: detect --source=/github/workspace --redact --no-banner
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - run: pip install pip-audit && pip-audit
      - uses: actions/setup-node@v7
        with: {node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - run: npm ci --prefix apps/web && npm audit --prefix apps/web --audit-level=high
